 <span class="note"> score ${r.s.toFixed(2)} of ±2 · ${r.ag}/5 agree</span>

 [].forEach(f=>{const v=inst==='NQ'?f.nq:f.es,p=(v||0)/2*50;h+=`<div class="fac"><span>${esc(f.n)}</span><span class="note">${v==null?'not verified':LBL[v]}</span><div class="bar"><i style="background:${p<0?'var(--red)':'var(--green)'};${p<0?'right:50%;width:'+(-p)+'%':'left:50%;width:'+p+'%'}"></i></div></div>`});
 h+=`</div><div class="box"><div class="eyebrow">Why</div><p style="margin:6px 0 8px">${esc(d.sum)}</p>${d.fs.filter(f=>(inst==='NQ'?f.nq:f.es)!=null).map(f=>{const v=inst==='NQ'?f.nq:f.es;return `<div class="fac" style="display:block"><b style="color:var(--${v>0?'green':v<0?'red':'amb'})">${v>0?'↗':v<0?'↘':'→'} ${esc(f.n)}</b><div class="note" style="margin-top:2px">${esc(f.read)}</div></div>`}).join('')}</div>`;
 h+=`<div class="box"><div class="eyebrow">What flips the bias</div><ul>${d.flip.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
 if((d.gaps||[]).length)h+=`<div class="box"><div class="eyebrow">Data gaps</div><ul>${d.gaps.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
 h+=`<div class="note">A decision aid, not a guarantee. Judge it by the Record tab.</div>`;
 $('view').innerHTML=h;
}
function why(){
 const d=latest(S.sess);if(!d){$('view').innerHTML=empty();return}
 $('view').innerHTML=d.fs.map(f=>{const v=S.inst==='NQ'?f.nq:f.es;return `<div class="box"><div class="eyebrow">${esc(f.n)} · ${v==null?'Not verified':LBL[v]}</div><h3>${esc(f.read)}</h3>
 <div class="for">EVIDENCE</div><ul>${f.ev.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
 <div class="ag">COUNTERARGUMENT</div><ul>${f.ct.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
 ${(f.src||[]).map(s=>`<a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])} ↗</a> `).join('')}</div>`}).join('');
}
function setOut(id,inst,o){
 const d=DOCS.find(x=>x.id===id);if(!d)return;if(!DB){d.out=Object.assign({},d.out||{});d.out[inst]=d.out[inst]===o?null:o;try{const a=JSON.parse(localStorage.getItem('mb_out')||'{}');a[id]=d.out;localStorage.setItem('mb_out',JSON.stringify(a))}catch(e){}render();return}const out=Object.assign({},d.out||{});out[inst]=out[inst]===o?null:o;
 DB.doc('briefs/'+id).update({out}).catch(()=>{});
}
function arch(){
 let h=`<div class="eyebrow" style="margin:4px 0">Bias history · newest first</div><div class="box"><table><tr><th>Brief</th><th>NQ</th><th>ES</th><th>${S.inst} result</th></tr>`;
 if(!DOCS.length)h+=`<tr><td colspan="4" class="note">No past briefs yet. Each day’s brief is saved here and never edited, so today’s call becomes tomorrow’s chart check.</td></tr>`;
 DOCS.forEach(d=>{const r=calc(d,S.inst),o=(d.out||{})[S.inst];
  h+=`<tr><td>${esc(d.date)}<br><span class="note">${d.sess==='ON'?'Overnight':'9:30 open'}</span></td>${['NQ','ES'].map(i=>{const x=calc(d,i);return `<td style="color:var(--${x.bias==='Bullish'?'green':x.bias==='Bearish'?'red':'amb'});font-weight:700">${arrow(x.bias)} ${x.bias}<br><span class="note">${x.c}</span></td>`}).join('')}<td>${CAN?['Up','Down','Flat'].map(x=>`<button class="${o===x?'on':''}" data-id="${d.id}" data-o="${x}">${x}</button>`).join(''):(o||'–')}</td></tr>`});
 h+=`</table></div><div class="eyebrow" style="margin:4px 0">Verified market tape</div><div class="box"><table><tr><th>Date</th><th>S&amp;P</th><th>Nasdaq Comp</th></tr>${TAPE.length?TAPE.map(t=>`<tr><td>${esc(t.date)}<br><span class="note">${esc(t.note||'')}</span></td><td>${t.spx>0?'+':''}${t.spx}%</td><td>${t.ixic==null?'–':(t.ixic>0?'+':'')+t.ixic+'%'}</td></tr>`).join(''):'<tr><td colspan=3 class="note">Empty.</td></tr>'}</table></div><button class="chip" id="exp" style="border:0;cursor:pointer;padding:8px 14px">Export CSV for backtesting</button><div class="note" style="margin-top:8px">Mark each result after the session (overnight: 6 p.m. to 9:30 a.m. net move; open: 9:30 to 4 p.m.). Briefs are never edited after publishing. Dates missing from the tape had no reliable close data.</div>`;
 $('view').innerHTML=h;
 const ex=$('exp');if(ex)ex.onclick=async()=>{try{const dl=(typeof claude!=='undefined')?await claude.use('downloads'):null;const r=['date,session,NQ_bias,NQ_conf,NQ_score,ES_bias,ES_conf,ES_score,NQ_result,ES_result,reconstructed'];DOCS.forEach(d=>{const a=calc(d,'NQ'),b=calc(d,'ES'),o=d.out||{};r.push(['"'+d.date+'"',d.sess,a.bias,a.c,a.s.toFixed(2),b.bias,b.c,b.s.toFixed(2),o.NQ||'',o.ES||'',d.recon?1:0].join(','))});r.push('','date,spx_pct,ixic_pct');TAPE.forEach(t=>r.push(['"'+t.date+'"',t.spx,t.ixic==null?'':t.ixic].join(',')));const txt=r.join('\n');let ta=$('csvbox');if(!ta){ta=document.createElement('textarea');ta.id='csvbox';ta.readOnly=true;ta.style.cssText='width:100%;height:170px;margin-top:8px;font:12px monospace;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px';ex.after(ta)}ta.value=txt;if(dl)await dl.save({filename:'macro-bias-history.csv',data:txt});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download='macro-bias-history.csv';a.click()}}catch(e){}};
 $('view').querySelectorAll('td button').forEach(b=>b.onclick=()=>setOut(b.dataset.id,S.inst,b.dataset.o));
}
function rec(){
 const rows=DOCS.map(d=>({...calc(d,S.inst),o:(d.out||{})[S.inst],sess:d.sess,rc:!!d.recon})).filter(x=>x.o&&x.bias!=='Neutral');
 const hit=x=>(x.bias==='Bullish'&&x.o==='Up')||(x.bias==='Bearish'&&x.o==='Down');
 const pct=a=>a.length?Math.round(a.filter(hit).length/a.length*100)+'%':'–';
 const cell=(l,a)=>`<div><b>${pct(a)}</b><span class="note">${l} (${a.length})</span></div>`;
 $('view').innerHTML=`<div class="box"><div class="eyebrow">Directional record · ${S.inst}</div><div class="stat">${cell('All',rows)}${['High','Medium','Low'].map(c=>cell(c,rows.filter(x=>x.c===c))).join('')}</div>
 <div class="stat" style="margin-top:8px">${cell('Overnight',rows.filter(x=>x.sess==='ON'))}${cell('9:30 open',rows.filter(x=>x.sess==='OPEN'))}${cell('Live',rows.filter(x=>!x.rc))}${cell('Backfilled',rows.filter(x=>x.rc))}</div>
 <p class="note">Backfilled calls are written after the fact and carry hindsight bias; only Live calls test the model. Neutral calls and unmarked results are excluded. Under about 30 marked calls this is noise, not proof. If High doesn’t beat Low, the weights get revised in the open.</p></div>`;
}
function render(){shell();({brief,why,arch,rec})[S.tab]()}
render();
(async()=>{
 try{
  const u=await claude.use('user');CAN=u?u.canEdit():false;
  DB=await claude.use('db');if(!DB){loadJson();return}
  DB.collection('briefs').orderBy('ts','desc').limit(120).onSnapshot(q=>{DOCS=q.docs.map(x=>({id:x.id,...x.data()}));render()},()=>{loadJson()});
  DB.collection('tape').orderBy('ts','desc').limit(60).onSnapshot(q=>{TAPE=q.docs.map(x=>x.data());if(S.tab==='arch')render()},()=>{});
 }catch(e){loadJson()}
})();
function loadJson(){if(DOCS.length)return;fetch('briefs.json?'+Date.now()).then(r=>r.json()).then(j=>{CAN=true;let o={};try{o=JSON.parse(localStorage.getItem('mb_out')||'{}')}catch(e){}DOCS=j.docs.slice().sort((a,b)=>b.ts-a.ts).map(d=>Object.assign(d,{out:o[d.id]||d.out||{}}));TAPE=(j.tape||[]).slice().sort((a,b)=>b.ts-a.ts);render()}).catch(()=>useSnap())}
function useSnap(){if(DOCS.length)return;OFF=true;DOCS=SNAP.docs;TAPE=SNAP.tape;render();$('clock').textContent+=' · offline snapshot, Oct 25'}
</script></body></html>
